<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nebula Play</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/src/styles/main.css">
  <link rel="stylesheet" href="/src/styles/player.css">
  <link rel="stylesheet" href="/src/styles/nav.css">
</head>
<body>
  <canvas id="nebula-canvas"></canvas>

  <div id="yt-player" style="position:fixed;bottom:0;left:0;width:200px;height:112px;opacity:0.01;pointer-events:none;z-index:-1;"></div>

  <button id="nav-toggle" class="nav-toggle">
    <svg class="icon-menu" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
      <line x1="4" y1="7" x2="20" y2="7"/>
      <line x1="4" y1="12" x2="20" y2="12"/>
      <line x1="4" y1="17" x2="20" y2="17"/>
    </svg>
    <svg class="icon-close" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
      <line x1="18" y1="6" x2="6" y2="18"/>
      <line x1="6" y1="6" x2="18" y2="18"/>
    </svg>
  </button>

  <button id="search-toggle" class="search-toggle" aria-label="Buscar música">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="11" cy="11" r="8"/>
      <line x1="21" y1="21" x2="16.65" y2="16.65"/>
    </svg>
  </button>

  <button id="screen-off-toggle" class="screen-off-toggle" aria-label="Simular tela desligada">
    <svg class="icon-power" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 2v10"/>
      <path d="M18.36 6.64a9 9 0 1 1-12.73 0"/>
    </svg>
    <svg class="icon-light" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M9 18h6"/>
      <path d="M10 22h4"/>
      <path d="M8.4 14.5a5.5 5.5 0 1 1 7.2 0c-1.5 1.3-1.6 1-1.6 2.5h-4c0-1.5-.1-1.2-1.6-2.5z"/>
    </svg>
  </button>

  <div id="nav-overlay" class="nav-overlay">
    <div class="nav-overlay-bg"></div>
    <div class="nav-overlay-content">
      <div class="nav-overlay-left">
        <div class="nav-brand">
          <svg width="36" height="36" viewBox="0 0 32 32" fill="none">
            <circle cx="16" cy="16" r="14" stroke="#ff2222" stroke-width="1.5" opacity="0.6"/>
            <circle cx="16" cy="16" r="8" stroke="#ff2222" stroke-width="1.5"/>
            <circle cx="16" cy="16" r="3" fill="#ff2222"/>
          </svg>
          <span class="nav-brand-text">Nebula</span>
        </div>

        <nav class="nav-main">
          <a href="#" class="nav-link active" data-tab="home">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9,22 9,12 15,12 15,22"/></svg>
            <span>Home</span>
          </a>
          <a href="#" class="nav-link" data-tab="search">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <span>Search</span>
          </a>
        </nav>
      </div>

      <div class="nav-overlay-center">
        <div id="tab-home" class="nav-tab active">
          <div class="nav-tab-section">
            <h2 class="nav-section-title">Favoritos</h2>
            <div id="nav-favorites"></div>
          </div>
        </div>

        <div id="tab-search" class="nav-tab">
          <div class="search-bar-wrap">
            <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <input id="search-input" class="search-input" type="text" placeholder="Buscar músicas, artistas..." autocomplete="off" />
          </div>
          <div id="search-results" class="search-results"></div>
        </div>
      </div>
    </div>
  </div>

  <div id="player-bar" class="player-bar">
    <div class="player-info" id="player-info">
      <div class="player-thumb" id="player-thumb"></div>
      <div class="player-meta">
        <span id="player-title" class="player-title">Select a track</span>
        <span id="player-artist" class="player-artist">--</span>
      </div>
    </div>

    <div id="queue-menu" class="queue-menu">
      <div class="queue-header">
        <span class="queue-title">Fila de Reprodução</span>
        <button id="queue-close" class="queue-close">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div id="queue-sections" class="queue-sections"></div>
    </div>

    <div class="player-controls">
      <button id="btn-prev" class="ctrl-btn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
      </button>
      <button id="btn-play" class="ctrl-btn ctrl-play">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
      </button>
      <button id="btn-next" class="ctrl-btn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
      </button>
    </div>

    <div class="player-progress">
      <span id="time-current" class="time">0:00</span>
      <div id="progress-bar" class="progress-bar">
        <div id="progress-track" class="progress-track">
          <div id="progress-fill" class="progress-fill"></div>
        </div>
      </div>
      <span id="time-total" class="time">0:00</span>
    </div>

    <div class="player-volume">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11,5 6,9 2,9 2,15 6,15 11,19"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
      <div id="volume-bar" class="volume-bar">
        <div id="volume-fill" class="volume-fill"></div>
      </div>
    </div>
  </div>

  <div id="screen-off" class="screen-off">
    <div class="screen-off-bg" id="screen-off-bg"></div>
    <div class="screen-off-trail" id="screen-off-trail">
      <div class="screen-off-trail-fill" id="screen-off-trail-fill"></div>
    </div>
    <div class="screen-off-target"></div>
    <button id="screen-off-copy" class="screen-off-toggle screen-off-copy" tabindex="-1" aria-hidden="true">
      <svg class="icon-power" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2v10"/>
        <path d="M18.36 6.64a9 9 0 1 1-12.73 0"/>
      </svg>
      <svg class="icon-light" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 18h6"/>
        <path d="M10 22h4"/>
        <path d="M8.4 14.5a5.5 5.5 0 1 1 7.2 0c-1.5 1.3-1.6 1-1.6 2.5h-4c0-1.5-.1-1.2-1.6-2.5z"/>
      </svg>
    </button>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
